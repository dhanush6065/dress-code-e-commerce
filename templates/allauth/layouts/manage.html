
{% extends "allauth/layouts/base.html" %}

{% block body %}
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <div class="allauth-container">
        <div class="brand">DRESS CODE</div>

        <div class="allauth-content">
            {% block content %}{% endblock content %}
        </div>
    </div>
{% endblock body %}
