 {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dress Code</title>
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>

    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">DRESS CODE</a>

        <nav>
            <a href="{% url 'home' %}">HOME</a>
            <a href="{% url 'shop' %}">SHOP</a>
            <a href="{% url 'categories' %}">CATEGORIES</a>
        </nav>

        <a href="{% url 'login' %}" class="login-nav">SIGN IN</a>
    </header>

    <main class="signup-section">
        <div class="signup-container">

            <p class="eyebrow">JOIN OUR COMMUNITY</p>

            <h1>CREATE YOUR ACCOUNT</h1>

            <p class="subtitle">
                Discover your style. Create an account to get started.
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">CREATE ACCOUNT</button>
            </form>

            <p class="login-text">
                Already have an account?
                <a href="{% url 'login' %}">Sign In</a>
            </p>

        </div>
    </main>

    <footer class="footer">
        <p>© 2026 DRESS CODE. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
