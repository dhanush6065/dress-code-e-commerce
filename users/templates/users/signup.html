
<!DOCTYPE html>
<html>
<head>
    <title>Customer Signup - Dress Code</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .signup-container {
            width: 350px;
            margin: 60px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <h1>Create Your Account</h1>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Sign Up</button>
        </form>

    </div>

</body>
</html>
