<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Password Reset</title>
</head>
<body>

    <h1>Verify Password Reset OTP</h1>

    <p>Enter the OTP sent to your email.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="otp">Enter OTP:</label>
        <input
            type="text"
            id="otp"
            name="otp"
            maxlength="6"
            required
        >

        <br><br>

        <button type="submit">Verify OTP</button>
    </form>
    <form method="POST" action="{% url 'resend_password_reset_otp' %}">
    {% csrf_token %}
    <button type="submit">Resend OTP</button>
    </form>

</body>
</html>
