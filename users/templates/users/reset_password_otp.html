
<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Password Reset</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        input {
            padding: 10px;
            width: 200px;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #222;
            color: white;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

    <h1>Verify Password Reset OTP</h1>

    <p>Enter the OTP sent to your email.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="otp">Enter OTP:</label><br>

        <input
            type="text"
            id="otp"
            name="otp"
            maxlength="6"
            required
        >

        <div class="button-group">
            <button type="submit">Verify OTP</button>
        </div>
    </form>

    <form method="POST" action="{% url 'resend_password_reset_otp' %}">
        {% csrf_token %}

        <div class="button-group">
            <button type="submit">Resend OTP</button>
        </div>
    </form>

</body>
</html>
